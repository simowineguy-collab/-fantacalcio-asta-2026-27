const DATA = DB.rows;
const COLS = DB.columns;

let state = {purchased: {}, paid: {}};
try {
  const old = JSON.parse(localStorage.getItem("fantacalcio_asta_v3") || "null");
  if (old) state = old;
} catch(e) {}

function save() {
  try { localStorage.setItem("fantacalcio_asta_v3", JSON.stringify(state)); } catch(e) {}
}

function buildFilters() {
  const excluded = ["Giocatore","Prezzo pagato","Acquistato","Caratteristiche speciali"];
  COLS.filter(c => !excluded.includes(c)).forEach(col => {
    const box = document.createElement("div");
    box.className = "filter";
    const label = document.createElement("label");
    label.textContent = col;
    const select = document.createElement("select");
    select.dataset.column = col;

    const all = document.createElement("option");
    all.value = "";
    all.textContent = "Tutti";
    select.appendChild(all);

    [...new Set(DATA.map(r => r[col]).filter(Boolean))]
      .sort((a,b) => String(a).localeCompare(String(b), "it", {numeric:true}))
      .forEach(value => {
        const option = document.createElement("option");
        option.value = value;
        option.textContent = value;
        select.appendChild(option);
      });

    select.addEventListener("change", render);
    box.append(label, select);
    document.getElementById("filters").appendChild(box);
  });
}

function render() {
  const query = document.getElementById("search").value.trim().toLowerCase();
  const selects = [...document.querySelectorAll("#filters select")].filter(s => s.value);

  const rows = DATA.filter(row => {
    if (query) {
      const name = String(row["Giocatore"] || "").toLowerCase();
      if (!name.includes(query)) return false;
    }
    return selects.every(s => String(row[s.dataset.column] || "") === s.value);
  });

  document.getElementById("shown").textContent = rows.length;

  const boughtNames = Object.keys(state.purchased).filter(k => state.purchased[k]);
  const spent = boughtNames.reduce((sum, name) => sum + (Number(state.paid[name]) || 0), 0);
  document.getElementById("bought").textContent = boughtNames.length;
  document.getElementById("spent").textContent = spent;
  document.getElementById("remaining").textContent = 500 - spent;

  document.getElementById("head").innerHTML =
    COLS.map(c => "<th>" + escapeHtml(c) + "</th>").join("");

  const body = document.getElementById("body");
  body.innerHTML = "";

  rows.forEach(row => {
    const name = String(row["Giocatore"] || "");
    const tr = document.createElement("tr");
    if (state.purchased[name]) tr.className = "purchased";

    COLS.forEach(col => {
      const td = document.createElement("td");

      if (col === "Acquistato") {
        const select = document.createElement("select");
        select.className = "buy";
        const no = new Option("No", "no");
        const yes = new Option("Sì", "si");
        select.add(no, yes);
        select.value = state.purchased[name] ? "si" : "no";
        select.addEventListener("change", () => {
          state.purchased[name] = select.value === "si";
          save();
          render();
        });
        td.appendChild(select);
      } else if (col === "Prezzo pagato") {
        const input = document.createElement("input");
        input.type = "number";
        input.min = "0";
        input.step = "1";
        input.value = state.paid[name] || "";
        input.style.width = "65px";
        input.addEventListener("change", () => {
          state.paid[name] = Number(input.value) || 0;
          save();
          render();
        });
        td.appendChild(input);
      } else {
        td.textContent = row[col] || "";
        if (col === "Caratteristiche speciali") td.className = "special";
      }

      tr.appendChild(td);
    });

    body.appendChild(tr);
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}

document.getElementById("search").addEventListener("input", render);

document.getElementById("reset").addEventListener("click", () => {
  document.getElementById("search").value = "";
  document.querySelectorAll("#filters select").forEach(s => s.value = "");
  render();
});

document.getElementById("clear").addEventListener("click", () => {
  if (confirm("Cancellare tutti gli acquisti e i prezzi pagati?")) {
    state = {purchased: {}, paid: {}};
    save();
    render();
  }
});

buildFilters();
render();
</script>
